    <text x="350" y="110" text-anchor="middle" font-size="16">5.00 m</text>
    <text x="205" y="293" text-anchor="middle" font-size="19">ROOM A</text>
    <text x="467" y="293" text-anchor="middle" font-size="19">ROOM B</text>
    <text x="840" y="345" text-anchor="middle" font-size="19">ASSEMBLY</text>
    <text x="350" y="610" text-anchor="middle" font-size="19">WORK AREA</text>
    <text x="760" y="582" text-anchor="middle" font-size="19">STORAGE</text>
