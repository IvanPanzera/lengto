    <text x="80" y="849" font-size="13" fill="#728188">Synthetic drawing for illustration. Not construction documentation.</text>
    <text x="1118" y="826" text-anchor="end" font-size="13" fill="#728188">SHEET 01</text>
    <text x="1118" y="849" text-anchor="end" font-size="13" fill="#728188">1200 × 900 px</text>
